[package]
name = "ekips-cli"
description = "Command-line tool for the Ekips Prime Pro robot language"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "ekips"
path = "src/main.rs"

[dependencies]
ekips-compiler.workspace = true
ekips-i18n.workspace = true
clap = { version = "4.5", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions", "color"] }
anstream = "1"
anstyle = "1"

[lints]
workspace = true
